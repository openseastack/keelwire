# Android app (APK for sideloading; Play Store bundle later).
#
# Called by release.yml for every release, or run on its own from the
# Actions tab ("Android" → Run workflow). With a tag, the APK is attached to
# that (draft) release; it is always kept as a workflow artifact too.
#
# Signing secrets (Settings › Secrets and variables › Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the release keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias (keelwire)
#   ANDROID_KEY_PASSWORD       key password (same as the keystore's for PKCS12)
# Without them a debug-signed APK is built (fine for testers, but it can't
# be updated in place by a release-signed one).

name: Android

on:
  workflow_call:
    inputs:
      tag: { type: string, required: false, default: "" }
  workflow_dispatch:
    inputs:
      tag:
        description: "Attach the APK to this release tag (e.g. v0.1.0); leave empty for an artifact only"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - name: Install the NDK
        run: |
          sdkmanager --install "ndk;27.2.12479018" "platforms;android-34" "build-tools;34.0.0" >/dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-linux-android,armv7-linux-androideabi" }
      - uses: Swatinem/rust-cache@v2
        with: { key: android }
      - run: npm ci
        working-directory: ui
      - run: npm ci
        working-directory: crates/keelwire-tauri

      - name: Generate the Android project
        working-directory: crates/keelwire-tauri
        run: npm run --silent tauri -- android init --ci

      - name: Release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          KS="$RUNNER_TEMP/keelwire-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KS"
          echo "ANDROID_KEYSTORE_PATH=$KS" >> "$GITHUB_ENV"
          python3 scripts/android-signing.py crates/keelwire-tauri/gen/android/app/build.gradle.kts

      - name: Build the APK
        working-directory: crates/keelwire-tauri
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then MODE=""; else MODE="--debug"; fi
          npm run --silent tauri -- android build --apk --target aarch64 --target armv7 --ci $MODE

      - name: Collect the APK
        id: apk
        run: |
          v=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          src=$(find crates/keelwire-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -1)
          [ -n "$src" ] || { echo "::error::no APK produced"; exit 1; }
          suffix=""; [ -z "$ANDROID_KEYSTORE_BASE64" ] && suffix="-debug"
          out="Keelwire_${v}_android${suffix}.apk"
          cp "$src" "$out"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        with:
          name: keelwire-android-apk
          path: ${{ steps.apk.outputs.file }}
      - name: Attach to the release
        if: env.TAG != ''
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release upload "$TAG" "${{ steps.apk.outputs.file }}" --clobber -R "${{ github.repository }}"
