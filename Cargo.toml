[workspace]
resolver = "2"
members = ["crates/keelwire-core", "crates/keelwire-hal", "crates/keelwire-server", "crates/keelwire-ios", "crates/keelwire-tauri"]
# The desktop wrapper needs WebKitGTK / WebView2 system libraries; build it explicitly:
#   cargo build -p keelwire-tauri --release   (or `cargo tauri build` inside crates/keelwire-tauri)
default-members = ["crates/keelwire-core", "crates/keelwire-hal", "crates/keelwire-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/openseastack/keelwire"
rust-version = "1.87"

[workspace.dependencies]
keelwire-core = { path = "crates/keelwire-core" }
keelwire-hal = { path = "crates/keelwire-hal" }
keelwire-server = { path = "crates/keelwire-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "signal"] }
tokio-serial = "5.4"
socketcan = { version = "3.3", features = ["tokio"] }
tokio-tungstenite = "0.24"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace"] }
rust-embed = "8"
mime_guess = "2"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
